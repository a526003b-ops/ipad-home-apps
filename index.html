<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPad Home Apps</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#111; color:#eee;
      min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px; }
    h1 { font-weight:600; font-size:1.4rem; margin:0; color:#bbb; }
    .row { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
    a.card { width:220px; text-decoration:none; color:inherit; background:#1c1c1f; border-radius:24px; padding:28px 22px;
      border:1px solid #2a2a30; text-align:center; }
    a.card strong { display:block; font-size:1.25rem; margin-bottom:8px; }
    a.card span { color:#8a8a94; font-size:.95rem; }
    .hint { max-width:440px; color:#8a8a94; font-size:.9rem; line-height:1.45; text-align:center; }
  </style>
</head>
<body>
  <h1>Install these on your iPad</h1>
  <div class="row">
    <a class="card" href="https://umbra-birch-pixel-pilot.grok.me/"><strong>Debra's Diary</strong><span>The real journal</span></a>
    <a class="card" href="https://flora-clover-lion-birch.grok.me/"><strong>Debra Superstar</strong><span>The real singing game</span></a>
    <a class="card" href="wallpaper/"><strong>Wallpaper</strong><span>Need the grok.me link</span></a>

</body>
</html>
